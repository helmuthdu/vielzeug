name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  change-files:
    name: Verify change files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          root-install: 'false'

      - run: node common/scripts/install-run-rush.js change --verify

  test:
    name: Build, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Build packages
        run: |
          node common/scripts/install-run-rush.js rebuild --verbose
          pnpm verify:prod-gate

      - name: Unit tests
        run: pnpm test --run ${{ github.event_name == 'push' && '--coverage' || '' }}

      - name: Archive integration tests
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm --filter @vielzeug/archive test:integration

      # Real-browser tests against the built dist IIFE bundles (rush rebuild above produced
      # them). The fixture loads bundles directly via page.setContent(), so no dev server.
      # - name: Browser e2e tests (refine)
      #   run: |
      #     pnpm exec playwright install --with-deps chromium
      #     pnpm --filter @vielzeug/refine test:e2e

      - name: Build and test demos
        run: pnpm validate:demos

      # Every demo that ships a Worker API validates it: typecheck + integration suite
      # (real workerd + local D1) + wrangler dry-run bundle check. The api:* scripts
      # build their workspace dependencies themselves.
      - name: Validate demo APIs
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          for dir in demos/*/; do
            [ -f "${dir}package.json" ] || continue
            if grep -q '"api:test"' "${dir}package.json"; then
              (cd "$dir" && pnpm api:typecheck && pnpm api:test && pnpm api:build) || exit 1
            fi
          done

      - name: Validate REPL examples
        run: pnpm validate:repl

      - name: Build docs site
        run: pnpm docs:build

      - name: Upload coverage report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          rush-install: 'false'

      - name: Biome
        run: pnpm lint

      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@3cbf14efd750961dba35fccbf00f9e14028cb1f5 # v1.80.2
        with:
          fail_level: error

      - name: Package manifests
        run: pnpm check:package-manifests

      - name: AI metadata
        run: pnpm check:ai-data

      - name: Docs and README structure
        run: |
          pnpm validate:docs
          pnpm validate:readme
