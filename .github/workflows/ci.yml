name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ github.event_name == 'push' || steps.filter.outputs.src == 'true' }}
      docs: ${{ github.event_name == 'push' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Prose-only PRs skip runtime tests, but published docs still build.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            src:
              - '**'
              - '!**/*.md'
              - '!changes/**'
            docs:
              - '**/*.md'
              - '!**/AGENTS.md'
              - '!.github/**'
              - '!.junie/**'
              - '!.agents/README.md'
              - '!.agents/conventions.md'
              - '!.agents/reference/security-checklist.md'
              - '!changes/**'

  change-files:
    name: Verify change files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          install: "false"

      - run: bun run check:change-files

  build:
    name: Build packages
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Build packages
        run: |
          bun run build
          bun run verify:prod-gate

      # Packed-consumer icon contract (tarball install + jsdom + tsc resolution matrix).
      # Excluded from refine's own `build` because it packs the whole @vielzeug/* closure
      # and runs a real npm install (~40s): a release-shaped gate, not an inner-loop check.
      - name: Verify packed icon contract (refine)
        run: bun run --filter @vielzeug/refine check:packed-icons

      # A tarball preserves executable bits and package-relative paths.
      - name: Archive package outputs
        run: tar -czf package-build.tar.gz packages/*/dist packages/codex/data

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-dist
          path: package-build.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  test:
    name: Unit tests (sharded)
    needs: [ changes, build ]
    if: github.event_name == 'pull_request' && needs.changes.outputs.src == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: package-dist

      - run: tar -xzf package-build.tar.gz

      - name: Unit tests
        run: bun run test --run --shard=${{ matrix.shard }}/3

  test-full:
    name: Unit tests (coverage)
    needs: build
    if: github.event_name == 'push' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: package-dist

      - run: tar -xzf package-build.tar.gz

      - name: Unit tests
        run: bun run test --run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  integration:
    name: Archive integration tests
    needs: [ changes, build ]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: package-dist

      - run: tar -xzf package-build.tar.gz

      - name: Archive integration tests
        run: bun run --filter @vielzeug/archive test:integration

  demos:
    name: Demos
    needs: [ changes, build ]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: package-dist

      - run: tar -xzf package-build.tar.gz

      - name: Build and test demos
        run: bun run validate:demos

      # Every demo that ships a Worker API validates it: typecheck + integration suite
      # (real workerd + local D1) + wrangler dry-run bundle check. The api:* scripts
      # build their workspace dependencies themselves.
      - name: Validate demo APIs
        run: |
          for dir in demos/*/; do
            [ -f "${dir}package.json" ] || continue
            if grep -q '"api:test"' "${dir}package.json"; then
              (cd "$dir" && bun run api:typecheck && bun run api:test && bun run api:build) || exit 1
            fi
          done

  docs:
    name: REPL and docs site
    needs: [ changes, build ]
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: package-dist

      - run: tar -xzf package-build.tar.gz

      - name: Validate REPL examples
        run: bun run validate:repl

      - name: Build docs site
        run: bun run docs:build

      # Real-browser tests against the built dist IIFE bundles (build job produced them).
      # The fixture loads bundles directly via page.setContent(), so no dev server.
      # - name: Browser e2e tests (refine)
      #   run: |
      #     bun x playwright install --with-deps chromium
      #     bun run --filter @vielzeug/refine test:e2e

  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Biome
        run: bun run lint

      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        with:
          fail_level: error

      - name: Package manifests
        run: bun run check:package-manifests

      - name: AI metadata
        run: bun run check:ai-data

      - name: Docs, README, and sidebar structure
        run: |
          bun run validate:docs
          bun run validate:readme
          bun run validate:sidebar

  checks:
    name: Build, test, docs
    needs: [ changes, build, test, test-full, integration, demos, docs ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            exit 1
          fi
