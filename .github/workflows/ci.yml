name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  change-files:
    name: Verify change files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          root-install: 'false'

      - run: node common/scripts/install-run-rush.js change --verify

  test:
    name: Build, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Build packages
        run: |
          node common/scripts/install-run-rush.js rebuild --verbose
          pnpm verify:prod-gate

      - name: Unit tests
        run: pnpm test --run ${{ github.event_name == 'push' && '--coverage' || '' }}

      - name: Build and test demos
        run: pnpm validate:demos

      - name: Validate REPL examples
        run: pnpm validate:repl

      - name: Build docs site
        run: pnpm docs:build

      - name: Upload coverage report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          rush-install: 'false'

      - name: Biome
        run: pnpm lint

      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@ab7138020abfe6cd20b742c82e5b7a9749fb5884 # v1.75.0
        with:
          fail_level: error

      - name: Package manifests
        run: pnpm check:package-manifests

      - name: AI metadata
        run: pnpm check:ai-data

      - name: Docs and README structure
        run: |
          pnpm validate:docs
          pnpm validate:readme
