name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  change-files:
    name: Verify change files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          install: "false"

      - run: bun run check:change-files

  test:
    name: Build, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Build packages
        run: |
          bun run build
          bun run verify:prod-gate

      # Packed-consumer icon contract (tarball install + jsdom + tsc resolution matrix).
      # Excluded from refine's own `build` because it packs the whole @vielzeug/* closure
      # and runs a real npm install (~40s): a release-shaped gate, not an inner-loop check.
      - name: Verify packed icon contract (refine)
        run: bun run --filter @vielzeug/refine check:packed-icons

      - name: Unit tests
        run: bun run test --run ${{ github.event_name == 'push' && '--coverage' || '' }}

      - name: Archive integration tests
        env:
          WRANGLER_SEND_METRICS: "false"
        run: bun run --filter @vielzeug/archive test:integration

      # Real-browser tests against the built dist IIFE bundles (bun run build above produced
      # them). The fixture loads bundles directly via page.setContent(), so no dev server.
      # - name: Browser e2e tests (refine)
      #   run: |
      #     bun x playwright install --with-deps chromium
      #     bun run --filter @vielzeug/refine test:e2e

      - name: Build and test demos
        run: bun run validate:demos

      # Every demo that ships a Worker API validates it: typecheck + integration suite
      # (real workerd + local D1) + wrangler dry-run bundle check. The api:* scripts
      # build their workspace dependencies themselves.
      - name: Validate demo APIs
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          for dir in demos/*/; do
            [ -f "${dir}package.json" ] || continue
            if grep -q '"api:test"' "${dir}package.json"; then
              (cd "$dir" && bun run api:typecheck && bun run api:test && bun run api:build) || exit 1
            fi
          done

      - name: Validate REPL examples
        run: bun run validate:repl

      - name: Build docs site
        run: bun run docs:build

      - name: Upload coverage report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Biome
        run: bun run lint

      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          fail_level: error

      - name: Package manifests
        run: bun run check:package-manifests

      - name: AI metadata
        run: bun run check:ai-data

      - name: Docs, README, and sidebar structure
        run: |
          bun run validate:docs
          bun run validate:readme
          bun run validate:sidebar
