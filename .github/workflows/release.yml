name: Release (tag + GitHub release only)

# Backfill for versions published outside publish.yml — normally `pnpm release:publish-local`
# (scripts/release/local-publish.mjs), which deliberately never tags so a stale local clone
# can't push a wrong tag. Scans every publishable package whose committed version is on npm but
# not yet tagged, then tags and creates a GitHub release for each. Never runs `npm publish`, so
# it needs neither the `npm-publish` environment nor `id-token: write`.
#
# Do NOT register this filename as an npm Trusted Publisher — it never publishes.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'List what would be tagged without tagging or creating releases'
        required: false
        default: false
        type: boolean

# Shares publish.yml's group — both push tags and create releases on the same repo.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has-releases: ${{ steps.plan.outputs.has-releases }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "❌ Releasing can only run from main, not ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          root-install: 'false'
          rush-install: 'false'

      - id: plan
        run: |
          PLAN=$(node scripts/release/cli.mjs release-plan)
          echo "matrix={\"include\":${PLAN}}" >> "$GITHUB_OUTPUT"
          [ "$PLAN" = "[]" ] && echo "has-releases=false" >> "$GITHUB_OUTPUT" || echo "has-releases=true" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.has-releases == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup
        with:
          root-install: 'false'
          rush-install: 'false'

      - name: Tag and create GitHub release
        env:
          DRY_RUN: ${{ inputs.dry-run && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/cli.mjs tag-release "${{ matrix.package }}" "${{ matrix.version }}" "${{ matrix.folder }}"
