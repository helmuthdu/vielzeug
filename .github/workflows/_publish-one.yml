name: Publish one package (reusable)

# The single "publish + tag + release" implementation. publish.yml runs it as a matrix, one job
# per package. A reusable workflow (rather than a composite action) is what lets one
# implementation serve as a matrix body with its own log and pass/fail per package.
#
# npm's Trusted Publishing validates the *triggering* workflow's filename (publish.yml), not
# this one — don't register `_publish-one.yml` on npmjs.com.
#
# Runs on a fresh runner: the checkout provides sources, README and LICENSE; the
# `built-packages` artifact from publish.yml's prepare job provides dist/ and the bumped manifests.

on:
  workflow_call:
    inputs:
      dry-run:
        default: false
        required: false
        type: boolean
      folder:
        required: true
        type: string
      package:
        required: true
        type: string
      ref:
        description: Commit to check out and tag — the version-bump commit prepare pushed
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  dry-run:
    if: inputs.dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup
        with:
          root-install: 'false'
          rush-install: 'false'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-packages
          path: packages/

      - name: Validate publish, tag and release
        env:
          DRY_RUN: '1'
        run: node scripts/release/cli.mjs publish "${{ inputs.package }}" "${{ inputs.version }}" "${{ inputs.folder }}"

  publish:
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    # Manual approval: Settings > Environments > npm-publish (required reviewers).
    environment: npm-publish
    permissions:
      contents: write
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup
        with:
          root-install: 'false'
          rush-install: 'false'
          trusted-publishing: 'true'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-packages
          path: packages/

      - name: Publish, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/cli.mjs publish "${{ inputs.package }}" "${{ inputs.version }}" "${{ inputs.folder }}"
