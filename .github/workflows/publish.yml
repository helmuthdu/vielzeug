name: Publish

# The only workflow that can run `npm publish`.
#
# npm's Trusted Publishing (OIDC) validates the *triggering* workflow's filename and allows
# exactly one filename per package, so every publish path must originate here: including the
# ones that delegate the actual `npm publish` to the reusable `_publish-one.yml`. Register
# `publish.yml` (not `_publish-one.yml`) as the Trusted Publisher on npmjs.com for every
# @vielzeug/* package. See `.github/AGENTS.md`.
#
# Full-family lockstep: a train publishes EVERY publishable package at the train number
# (apply-train.mjs), so a consumer upgrading to any train gets one consistent version set and
# exact @vielzeug/* pins always resolve: never nested duplicate copies of one library.
#
#   mode=single   apply the train where only the named package has real changes (it must have
#                 a pending change file); every other package rides alignment-only
#   mode=all      apply the train + publish the full family (riders = every pending change file)
#   mode=missing  publish any version already committed but absent from npm (no version bump)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'single: only the named package has real changes (needs "package") · all: full-family train from every pending change file · missing: backfill versions already committed but absent from npm (no version bump)'
        required: true
        type: choice
        options:
          - single
          - all
          - missing
      package:
        description: 'mode=single only: the one package with real changes (e.g. @vielzeug/coins). Must have a pending change file.'
        required: false
        type: string
      dry-run:
        description: 'Do everything except the actual npm publish / git tag / GitHub release'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    if: inputs.mode != 'missing'
    runs-on: ubuntu-latest
    outputs:
      has-releases: ${{ steps.plan.outputs.has-releases }}
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.head.outputs.sha }}
      train: ${{ steps.apply.outputs.train }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "❌ Publishing can only run from main, not ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # A re-run checks out the SHA the *original* dispatch pinned, not the current tip of main.
      # If the earlier attempt already pushed a version-bump commit, re-applying against that
      # stale baseline produces a second, conflicting "Bump versions" commit. Move to the real
      # tip first so a re-run is a no-op once main has already moved.
      - name: Sync to latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      # Node-only setup: a missing/typo'd "package" input or no pending change file fails in
      # seconds, before paying for the full install below.
      - uses: ./.github/actions/setup
        with:
          root-install: 'false'
          rush-install: 'false'

      - name: Require pending change files
        run: |
          PENDING=$(node scripts/release/cli.mjs changed-packages)
          if [ "${{ inputs.mode }}" = "single" ]; then
            if [ -z "${{ inputs.package }}" ]; then
              echo "❌ mode=single requires the 'package' input."
              exit 1
            fi
            node scripts/release/cli.mjs project "${{ inputs.package }}" > /dev/null
            if ! echo "$PENDING" | tr ' ' '\n' | grep -Fxq "${{ inputs.package }}"; then
              echo "❌ No pending change file for ${{ inputs.package }}. Run scripts/rush-change.mjs, commit it, and re-trigger."
              exit 1
            fi
          fi
          echo "Pending change files: $PENDING"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: ./.github/actions/setup

      - name: Build all packages
        run: node common/scripts/install-run-rush.js build --verbose

      # A release train must land on a tree the build didn't dirty: anything a build wrote
      # to a tracked file is a bug worth stopping for, not something to fold into the
      # train commit (which stages only manifests, changelogs, and change files).
      - name: Require a clean tree after build
        run: git diff --quiet || { git status --short; echo "❌ Build modified tracked files."; exit 1; }

      # Applies the CalVer train: every manifest stamped `YY.MM.N`, a changelog entry for every
      # package (real comments for riders, alignment-only for the rest: see
      # scripts/release/apply-train.mjs), the riders' change files consumed, one commit.
      # mode=single scopes the change-file consumption to the named package; every other package
      # still rides alignment-only. A dry run still stamps and commits locally (the publish
      # matrix is planned from the stamped versions) but never pushes: the push step is gated on
      # inputs.dry-run.
      - name: Apply release train
        id: apply
        run: |
          OUT=$(node scripts/release/cli.mjs apply ${{ inputs.mode == 'single' && inputs.package || '' }})
          echo "$OUT"
          TRAIN=$(echo "$OUT" | grep -oE 'release train [0-9]+\.[0-9]+\.[0-9]+' | head -1 | cut -d' ' -f3)
          echo "train=$TRAIN" >> "$GITHUB_OUTPUT"

      # The train publishes the full family, so every packed manifest is verified: the
      # workspace:* → exact-pin rewrite touches every package's tarball each train.
      - name: Verify packed consumer contracts
        run: pnpm verify:packed -- --package=all

      - name: Push train commit
        if: ${{ !inputs.dry-run }}
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "✅ Pushed release train to main"
              break
            fi
            [ "$attempt" -eq 3 ] && { echo "❌ Push failed after 3 attempts"; exit 1; }
            echo "🔄 Retry ${attempt}/3..."
          done

      # The commit each publish job checks out and tags: the pushed train commit, so tags and
      # release notes point at the CHANGELOG that includes this version.
      - name: Record release commit
        id: head
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Only what `npm pack` needs beyond the checkout: build output (codex also ships its
      # generated `data/`) plus the manifests and changelogs the train just stamped (a dry run never
      # pushes them, so the checkout won't have them).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-packages
          path: |
            packages/*/dist
            packages/codex/data
            packages/*/package.json
            packages/*/CHANGELOG.md
            packages/*/CHANGELOG.json
          retention-days: 1

      # The full family minus whatever is already on npm (a re-run after a partial matrix),
      # so the Actions UI only shows real publish jobs.
      - id: plan
        run: |
          PLAN=$(node scripts/release/cli.mjs plan)
          echo "matrix={\"include\":${PLAN}}" >> "$GITHUB_OUTPUT"
          [ "$PLAN" = "[]" ] && echo "has-releases=false" >> "$GITHUB_OUTPUT" || echo "has-releases=true" >> "$GITHUB_OUTPUT"

  # One approval unlocks the whole train. The environment's required reviewers fire once
  # here, and the publish matrix waits on this job instead of each package job declaring the
  # environment itself: a full-family train is ~40 matrix jobs, and per-job environments meant
  # ~40 approval prompts per train. This job runs nothing: it exists to hold the gate. Skipped
  # for dry runs (nothing reaches npm, so there is nothing to approve).
  gate:
    needs: prepare
    if: needs.prepare.outputs.has-releases == 'true' && !inputs.dry-run
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - run: |
          echo "Approved: publishing the train plan at ${{ needs.prepare.outputs.sha }}"

  # One job per package: own log, own pass/fail. `fail-fast: false` because one package failing
  # is no reason to abort the others; E409 conflicts are retried inside npm-publish.mjs.
  # `max-parallel` caps the burst of concurrent OIDC publishes a full-family train is (~40 at
  # once), which npm rate-limits well below that. No `environment` here on purpose: the single
  # `gate` job above already holds the human approval; re-declaring it per job is what made a
  # train need ~40 approvals.
  publish:
    needs: [prepare, gate]
    if: needs.prepare.outputs.has-releases == 'true' && (inputs.dry-run || needs.gate.result == 'success')
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_publish-one.yml
    permissions:
      contents: write
      id-token: write
    with:
      dry-run: ${{ inputs.dry-run }}
      folder: ${{ matrix.folder }}
      package: ${{ matrix.package }}
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ matrix.version }}

  # The train's single GitHub release (git-tag.mjs): one entry on the release page per train,
  # listing the packages that really changed. Per-package git tags happen inside each publish
  # job; this job only tags the train number and opens the aggregate release. Runs on the
  # train commit so the tag points at the pushed changelogs. Needs the publish matrix green
  # (or empty): an aggregate release over a train where some package failed to publish would
  # announce versions that don't exist on npm. Runs even when the matrix was skipped (a
  # re-run after every package already published): createTrainRelease is idempotent on the
  # train tag, so this closes the gap where a failed train-release job could never be retried.
  train-release:
    needs: [prepare, gate, publish]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') && needs.publish.result != 'failure' && needs.publish.result != 'cancelled' && needs.prepare.outputs.train != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry-run && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup
        with:
          root-install: 'false'
          rush-install: 'false'

      - name: Create the aggregate train release
        run: node scripts/release/cli.mjs train-release ${{ needs.prepare.outputs.train }}

  publish-missing:
    if: inputs.mode == 'missing'
    runs-on: ubuntu-latest
    # Manual approval: Settings > Environments > npm-publish (required reviewers). Every job that
    # runs `npm publish` uses this environment, so it is the one place publish access is granted.
    environment: npm-publish
    permissions:
      contents: read
      packages: write
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "❌ Publishing can only run from main, not ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          trusted-publishing: 'true'

      - name: Build all packages
        run: node common/scripts/install-run-rush.js rebuild --verbose

      - name: Publish versions missing on npm
        env:
          DRY_RUN: ${{ inputs.dry-run && '1' || '' }}
        run: node scripts/release/cli.mjs publish-missing
