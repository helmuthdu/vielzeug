name: Publish

# The only workflow that can run `npm publish`.
#
# npm's Trusted Publishing (OIDC) validates the *triggering* workflow's filename and allows
# exactly one filename per package, so every publish path must originate here — including the
# ones that delegate the actual `npm publish` to the reusable `_publish-one.yml`. Register
# `publish.yml` (not `_publish-one.yml`) as the Trusted Publisher on npmjs.com for every
# @vielzeug/* package. See `.github/AGENTS.md`.
#
#   mode=single   bump + publish one package (needs "package"; it must have a pending change file)
#   mode=all      bump + publish every package with a pending change file
#   mode=missing  publish any version already committed but absent from npm (no version bump)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'single: one package (needs "package") · all: every package with a pending change file · missing: backfill versions already committed but absent from npm (no version bump)'
        required: true
        type: choice
        options:
          - single
          - all
          - missing
      package:
        description: 'mode=single only: package name (e.g. @vielzeug/coins). Must have a pending change file.'
        required: false
        type: string
      dry-run:
        description: 'Do everything except the actual npm publish / git tag / GitHub release'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    if: inputs.mode != 'missing'
    runs-on: ubuntu-latest
    outputs:
      has-releases: ${{ steps.plan.outputs.has-releases }}
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "❌ Publishing can only run from main, not ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # A re-run checks out the SHA the *original* dispatch pinned, not the current tip of main.
      # If the earlier attempt already pushed a version-bump commit, re-applying against that
      # stale baseline produces a second, conflicting "Bump versions" commit. Move to the real
      # tip first so a re-run is a no-op once main has already moved.
      - name: Sync to latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      # Node-only setup: a missing/typo'd "package" input or no pending change file fails in
      # seconds, before paying for the full install below.
      - uses: ./.github/actions/setup
        with:
          root-install: 'false'
          rush-install: 'false'

      - name: Resolve packages to release
        id: packages
        run: |
          PENDING=$(node scripts/release/cli.mjs changed-packages)
          if [ "${{ inputs.mode }}" = "single" ]; then
            if [ -z "${{ inputs.package }}" ]; then
              echo "❌ mode=single requires the 'package' input."
              exit 1
            fi
            node scripts/release/cli.mjs project "${{ inputs.package }}" > /dev/null
            if ! echo "$PENDING" | tr ' ' '\n' | grep -Fxq "${{ inputs.package }}"; then
              echo "❌ No pending change file for ${{ inputs.package }}. Run 'rush change', commit it, and re-trigger."
              exit 1
            fi
            PACKAGES="${{ inputs.package }}"
          else
            PACKAGES="$PENDING"
          fi
          echo "list=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "csv=$(echo "$PACKAGES" | tr ' ' ',')" >> "$GITHUB_OUTPUT"

      - name: Record versions before bump
        run: node scripts/release/cli.mjs versions ${{ steps.packages.outputs.list }} > /tmp/versions-before.txt

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: ./.github/actions/setup

      - name: Build all packages
        run: node common/scripts/install-run-rush.js build --verbose

      # `rush publish --apply` stages the whole tree (`git add ':/*'`) into the bump commit, so
      # anything a build wrote to a tracked file would land on main unreviewed and `[skip ci]`.
      - name: Require a clean tree after build
        run: git diff --quiet || { git status --short; echo "❌ Build modified tracked files."; exit 1; }

      # `rush publish --apply` has no per-package filter; for mode=single the CLI isolates the
      # target's change file(s) first — see scripts/release/rush-publish-apply.mjs.
      - name: Apply version bump
        run: node scripts/release/cli.mjs apply ${{ inputs.mode == 'single' && inputs.package || '' }}

      - name: Verify packed consumer contracts
        run: pnpm verify:packed -- --package=${{ steps.packages.outputs.csv }}

      - name: Push version bump commit
        if: ${{ !inputs.dry-run }}
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "✅ Pushed version bump to main"
              break
            fi
            [ "$attempt" -eq 3 ] && { echo "❌ Push failed after 3 attempts"; exit 1; }
            echo "🔄 Retry ${attempt}/3..."
          done

      # The commit each publish job checks out and tags: the pushed bump commit, so tags and
      # release notes point at the CHANGELOG that includes this version.
      - name: Record release commit
        id: head
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Only what `npm pack` needs beyond the checkout: build output (codex also ships its
      # generated `data/`) plus the manifests and changelogs rush just bumped (a dry run never
      # pushes them, so the checkout won't have them).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-packages
          path: |
            packages/*/dist
            packages/codex/data
            packages/*/package.json
            packages/*/CHANGELOG.md
            packages/*/CHANGELOG.json
          retention-days: 1

      # Drops anything rush left unbumped or already on npm *before* the matrix is built, so the
      # Actions UI only shows real publish jobs.
      - id: plan
        run: |
          PLAN=$(node scripts/release/cli.mjs plan --before-file=/tmp/versions-before.txt ${{ steps.packages.outputs.list }})
          echo "matrix={\"include\":${PLAN}}" >> "$GITHUB_OUTPUT"
          [ "$PLAN" = "[]" ] && echo "has-releases=false" >> "$GITHUB_OUTPUT" || echo "has-releases=true" >> "$GITHUB_OUTPUT"

  # One job per package: own log, own pass/fail. `fail-fast: false` because one package failing
  # is no reason to abort the others; E409 conflicts are retried inside npm-publish.mjs.
  publish:
    needs: prepare
    if: needs.prepare.outputs.has-releases == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_publish-one.yml
    permissions:
      contents: write
      id-token: write
    with:
      dry-run: ${{ inputs.dry-run }}
      folder: ${{ matrix.folder }}
      package: ${{ matrix.package }}
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ matrix.version }}

  publish-missing:
    if: inputs.mode == 'missing'
    runs-on: ubuntu-latest
    # Manual approval: Settings > Environments > npm-publish (required reviewers). Every job that
    # runs `npm publish` uses this environment, so it is the one place publish access is granted.
    environment: npm-publish
    permissions:
      contents: read
      packages: write
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "❌ Publishing can only run from main, not ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          trusted-publishing: 'true'

      - name: Build all packages
        run: node common/scripts/install-run-rush.js rebuild --verbose

      - name: Publish versions missing on npm
        env:
          DRY_RUN: ${{ inputs.dry-run && '1' || '' }}
        run: node scripts/release/cli.mjs publish-missing
