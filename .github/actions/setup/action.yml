name: Setup monorepo
description: Install Node, Bun, and workspace dependencies with caches restored. Single source of truth for toolchain versions.

inputs:
  install:
    description: Run `bun ci` (frozen-lockfile workspace install) after cache restore
    default: "true"
  trusted-publishing:
    description: Prepare npm for Trusted Publishing (OIDC). Only jobs that run `npm publish` need this.
    default: "false"

runs:
  using: composite
  steps:
    # node-version-file keeps this the one place the Node version is declared: every other
    # workflow step that needs Node/npm relies on what this step installed instead of pinning
    # its own `node-version`. Node stays the runtime for Vitest/jsdom, Vite/VitePress, and npm
    # Trusted Publishing; Bun (next step) is the package manager and script runner.
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ".nvmrc"

    # Reads the version from root package.json#packageManager.
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    - name: Cache Bun install
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    # `bun ci` refuses to install when bun.lock is out of date or missing: the same
    # frozen-lockfile guarantee `pnpm install --frozen-lockfile` gave. One install covers
    # packages/*, demos/*, and repo tooling: the root workspaces glob is the whole registry.
    - name: Install workspace
      if: inputs.install == 'true'
      shell: bash
      run: bun ci

    # Pin npm 11: npm 12.0.0 (released 2026-07-08) omits the `sigstore` module from its
    # tarball, breaking OIDC trusted publishing with a misleading ENEEDAUTH (npm/cli#9722).
    # Drop this step once the Node 22 bundled npm is a fixed 12.x. No "configure npm registry"
    # step exists on purpose: writing an .npmrc auth line breaks OIDC (actions/setup-node#1440);
    # the repo-root .npmrc's `registry=` line is all npm needs.
    - name: Pin npm for trusted publishing
      if: inputs.trusted-publishing == 'true'
      shell: bash
      run: npm install -g npm@11
