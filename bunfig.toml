# Bun is this repo's package manager and script runner; Node 22 (see .nvmrc) stays the
# runtime for the toolchain (Vitest, Vite, VitePress, npm OIDC publishing).
#
# `hoisted` is deliberate: Bun's default for new workspaces is `isolated`, but Vite's
# config loader resolves plugins from the root node_modules and needs hoisted transitive
# dependencies (what pnpm's public hoisting provided). Isolated installs fail Vitest
# startup with MODULE_NOT_FOUND.
#
# minimumReleaseAge mirrors pnpm's supply-chain gate (pnpm's default is 1440 minutes =
# 1 day; Bun's unit is seconds). Keep the vetted fresh-release exclusions aligned with
# the dependency versions selected by workspace manifests.
[install]
linker = "hoisted"
minimumReleaseAge = 86400
minimumReleaseAgeExcludes = [
  "@cloudflare/workerd-darwin-64@1.20261116.1",
  "@cloudflare/workerd-darwin-arm64@1.20261116.1",
  "@cloudflare/workerd-linux-64@1.20261116.1",
  "@cloudflare/workerd-linux-arm64@1.20261116.1",
  "@cloudflare/workerd-windows-64@1.20261116.1",
  "@modelcontextprotocol/core@2.4.0",
  "@modelcontextprotocol/server@2.4.0",
  "@playwright/test@1.65.1",
  "@vue/compiler-core@3.5.45",
  "@vue/compiler-dom@3.5.45",
  "@vue/compiler-sfc@3.5.45",
  "@vue/compiler-ssr@3.5.45",
  "@vue/reactivity@3.5.45",
  "@vue/runtime-core@3.5.45",
  "@vue/runtime-dom@3.5.45",
  "@vue/server-renderer@3.5.45",
  "@vue/shared@3.5.45",
  "axe-core@4.14.1",
  "browserslist@4.29.6",
  "jsdom@31.0.1",
  "lucide@1.74.0",
  "miniflare@5.20261116.0-beta",
  "playwright-core@1.65.1",
  "playwright@1.65.1",
  "prettier@3.10.1",
  "update-browserslist-db@1.4.0",
  "vue@3.5.45",
  "workerd@1.20261116.1",
  "wrangler@4.163.0",
]
