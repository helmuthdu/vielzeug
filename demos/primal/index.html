<!doctype html>
<html class="dark" lang="en">
    <head>
        <meta charset="UTF-8" />
        <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
        <link href="/manifest.webmanifest" rel="manifest" />
        <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
        <meta content="Primal" name="apple-mobile-web-app-title" />
        <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
        <meta content="dark" name="color-scheme" />
        <meta content="#0b0907" name="theme-color" />
        <meta
            content="Primal: The Hunter's Journal: campaign binder, expedition setup and rules reference for Primal: The Awakening."
            name="description" />
        <meta content="Primal: The Hunter's Journal" property="og:title" />
        <meta
            content="Campaign binder, expedition setup and rules reference for Primal: The Awakening."
            property="og:description" />
        <meta content="website" property="og:type" />
        <meta content="summary" name="twitter:card" />
        <title>Primal: The Hunter's Journal</title>
        <!-- The splash icon is the first contentful paint: its mask image starts
             immediately at high priority instead of waiting for the app to boot. -->
        <link as="image" fetchpriority="high" href="%BASE_URL%monsters/The-Awakened.svg" rel="preload" />
    </head>
    <body>
        <div aria-hidden="true" class="splash" id="splash">
            <div class="splash__icon"></div>
        </div>
        <div id="app"></div>
        <script>
        // First paint: seed data-theme from the OS preference so the splash has a color
        // scheme before the app hydrates the stored setting (the splash follows data-theme
        // reactively), and point the icon mask at the Awakened SVG under the deploy base
        // (resolved against the favicon, which Vite rewrites with the base).
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const icon = new URL('monsters/The-Awakened.svg', document.querySelector('link[rel=icon]').href).href;
        document.getElementById('splash').style.setProperty('--awakened', `url("${icon}")`);
        </script>
        <style>
        /* Splash screen: solid background with the Awakened icon painted in the logo's
               colors (gold gradient in dark, brown-black in light). Inline so it paints before
               the app CSS loads; main.ts fades it out once the app is mounted. Literal colors
               because the theme tokens are not available yet at first paint. */
        .splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            background: #ffffff;
            transition:
                opacity 400ms ease,
                visibility 400ms ease;
        }

        html[data-theme='dark'] .splash {
            background: #0b0907;
        }

        .splash[data-hide] {
            visibility: hidden;
            pointer-events: none;
            opacity: 0;
        }

        .splash__icon {
            width: min(30vmin, 11rem);
            aspect-ratio: 1;
            background: linear-gradient(180deg, oklch(33% 0.045 55deg) 0%, oklch(17% 0.012 52deg) 100%);
            opacity: 0;
            -webkit-mask: var(--awakened, none) center / contain no-repeat;
            mask: var(--awakened, none) center / contain no-repeat;
        }

        html[data-theme='dark'] .splash__icon {
            background: linear-gradient(
                180deg,
                oklch(84.01% 0.0716 90.4deg) 0%,
                oklch(79.01% 0.0795 90.4deg) 45%,
                oklch(49.01% 0.0676 90.4deg) 100%
            );
        }

        /* main.ts sets data-ready only after the stored theme is hydrated, so the icon is
               never painted in the wrong theme's colors: it appears once, in its final colors. */
        .splash[data-ready] .splash__icon {
            animation:
                splash-rise 700ms cubic-bezier(0.16, 1, 0.3, 1) both,
                splash-glow 2.4s 700ms ease-in-out infinite;
        }

        @keyframes splash-rise {
            from {
                opacity: 0;
                transform: scale(0.86);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes splash-glow {
            0%,
            100% {
                filter: drop-shadow(0 0 0 transparent);
            }
            50% {
                filter: drop-shadow(0 0 18px color-mix(in oklch, var(--p-gold, #ceb97f) 45%, transparent));
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .splash {
                transition: none;
            }

            .splash[data-ready] .splash__icon {
                opacity: 1;
                animation: none;
            }
        }
        </style>
        <script src="/src/main.ts" type="module"></script>
    </body>
</html>
