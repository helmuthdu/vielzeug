<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Vielzeug Motors — eShop Demo</title>
        <meta
            content="A fictional luxury car eShop demo — browse, configure, compare, and check out — built with every @vielzeug package working together."
            name="description" />
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
        <!--
      Off the training-data-reflex font list on purpose (not Inter/Plus Jakarta, refine's own
      defaults). One family — Hanken Grotesk — carries UI, body, and large headings alike,
      matching how both reference OEM sites (Mercedes-Benz Store, BMW's Neuwagensuche) lean on a
      single typeface rather than a display/body/mono split; large headings use its light (300)
      weight, mirroring BMW's own real product-page h1 (28px / weight 300, confirmed by
      inspecting the live site while researching this redesign).
    -->
        <link
            href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..800;1,300..800&display=swap"
            rel="stylesheet" />
    </head>
    <body>
        <div id="app"></div>
        <script src="/src/main.ts" type="module"></script>
    </body>
</html>
